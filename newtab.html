<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Obsidian Daily Widget</title>
<link rel="stylesheet" href="shared/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-bottom);
  }
  .card {
    width: 340px;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="card-header">
      <span class="card-title">Day planner</span>
      <a class="icon-link" id="optionsLink" href="options.html" title="Settings">⚙</a>
    </div>

    <div class="placeholder" id="placeholder">Loading…</div>
    <button class="connect-button" id="connectButton" hidden>Connect vault folder</button>
    <form class="quick-add" id="quickAdd" hidden>
      <input class="quick-add-input" id="quickAddInput" type="text" placeholder="Add a task…" autocomplete="off" />
      <button class="quick-add-button" id="quickAddButton" type="submit" title="Add task">+</button>
    </form>
    <div class="quick-add-status" id="quickAddStatus" hidden></div>
    <div class="tasks" id="tasks"></div>
    <div class="more" id="more" hidden></div>
    <div class="stranded" id="stranded" hidden></div>
    <div class="heatmap" id="heatmap"></div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
